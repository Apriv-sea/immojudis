name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manual-collection:
    name: Single-scheduler data collection invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm run check:manual-collection

  web:
    name: Web (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Static security invariants
        run: npm run test:security-invariants
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://ci.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-publishable-key' }}
        run: npm run build
      - name: SSR, bundle and media budgets
        run: npm run build:budgets

  pipeline:
    name: Data pipeline (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: pipeline-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PIPELINE_TEST_DB_URL: postgresql://postgres:pipeline-test-only@localhost:5432/postgres
    defaults:
      run:
        working-directory: services/data-pipeline
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            services/data-pipeline/requirements.txt
            services/data-pipeline/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Resolve optional Docling and valuation stacks
        run: python -m pip install --dry-run -r requirements-docling.txt -r requirements-valuation.txt
      - name: Lint
        run: python -m ruff check .
      - name: Run tests
        run: python -m pytest -q
      - name: Audit direct and transitive Python dependencies
        run: python -m pip_audit -r requirements.txt

  database:
    name: Supabase migrations + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Validate migration versions
        run: npm run check:migrations
      - name: Start local Supabase
        run: npx --yes supabase@2.110.0 start
      - name: Replay migrations from zero
        run: npx --yes supabase@2.110.0 db reset --local --no-seed --log-level error
      - name: Detect migration drift
        run: npm run check:schema-drift
      - name: Run concurrent quota test
        run: npm run test:db-concurrency
      - name: Run database tests
        run: npx --yes supabase@2.110.0 test db
      - name: Check public catalogue over HTTP
        run: |
          status_path="$(mktemp)"
          trap 'rm -f "$status_path"' EXIT
          npx --yes supabase@2.110.0 status --output json > "$status_path"
          node scripts/check-local-catalogue.mjs "$status_path"
      - name: Stop local Supabase
        if: always()
        run: npx --yes supabase@2.110.0 stop --no-backup

  e2e:
    name: Investor journey (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Pin npm
        run: npm install --global npm@11.18.0
      - run: npm ci
      - name: Install Chromium, Firefox and WebKit
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run cross-browser journeys and accessibility checks
        run: npm run test:e2e

  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
