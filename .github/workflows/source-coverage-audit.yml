name: Manual source coverage audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [avoventes, licitor, vench, info_encheres, encheres_publiques, petites_affiches, cessions_etat, agrasc, encheres_immobilieres, notaires]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install -r services/data-pipeline/requirements.txt
      - name: Inventory public listings only
        working-directory: services/data-pipeline
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          SOURCE_FETCH_RELAY_URL: ${{ vars.SOURCE_FETCH_RELAY_URL }}
          SOURCE_FETCH_RELAY_TOKEN: ${{ secrets.SOURCE_FETCH_RELAY_TOKEN }}
        run: python -m src.source_coverage_audit --source "$AUDIT_SOURCE" --output "data/audits/$AUDIT_SOURCE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-inventory-${{ matrix.source }}
          path: services/data-pipeline/data/audits/*.json
          retention-days: 14
