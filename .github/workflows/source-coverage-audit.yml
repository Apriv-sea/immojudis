name: Manual source coverage audit
on:
  workflow_dispatch:
    inputs:
      audit_kind:
        description: "Inventory or frozen quality sample (read-only)"
        type: choice
        default: inventory
        options: [inventory, quality_sample, reconciliation]
      source_group:
        description: "Sources to audit (read-only)"
        type: choice
        default: all
        options: [all, cloud, followup, notarial]
permissions:
  contents: read
jobs:
  inventory:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: ${{ fromJSON(inputs.audit_kind == 'reconciliation' && '["agrasc","avoventes","cessions_etat"]' || inputs.source_group == 'notarial' && '["notaires","agrasc"]' || inputs.source_group == 'followup' && '["avoventes","vench","encheres_immobilieres"]' || inputs.source_group == 'cloud' && '["petites_affiches","cessions_etat"]' || '["avoventes","licitor","vench","info_encheres","encheres_publiques","petites_affiches","cessions_etat","agrasc","encheres_immobilieres","notaires"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/data-pipeline/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install -r services/data-pipeline/requirements.txt
      - name: Inventory public listings only
        if: inputs.audit_kind == 'inventory'
        working-directory: services/data-pipeline
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          SOURCE_FETCH_RELAY_URL: ${{ vars.SOURCE_FETCH_RELAY_URL }}
          SOURCE_FETCH_RELAY_TOKEN: ${{ secrets.SOURCE_FETCH_RELAY_TOKEN }}
        run: python -m src.source_coverage_audit --source "$AUDIT_SOURCE" --resolve-missing-locations --output "data/audits/$AUDIT_SOURCE.json"
      - name: Verify frozen quality sample against source pages
        if: inputs.audit_kind == 'quality_sample'
        working-directory: services/data-pipeline
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SOURCE_FETCH_RELAY_URL: ${{ vars.SOURCE_FETCH_RELAY_URL }}
          SOURCE_FETCH_RELAY_TOKEN: ${{ secrets.SOURCE_FETCH_RELAY_TOKEN }}
        run: python -m src.quality_sample_audit --source "$AUDIT_SOURCE" --output "data/audits/quality-$AUDIT_SOURCE.json"
      - name: Inspect remaining unexplained inventory URLs
        if: inputs.audit_kind == 'reconciliation'
        working-directory: services/data-pipeline
        env:
          AUDIT_SOURCE: ${{ matrix.source }}
          SOURCE_FETCH_RELAY_URL: ${{ vars.SOURCE_FETCH_RELAY_URL }}
          SOURCE_FETCH_RELAY_TOKEN: ${{ secrets.SOURCE_FETCH_RELAY_TOKEN }}
        run: python -m src.source_reconciliation_audit --source "$AUDIT_SOURCE" --output "data/audits/reconciliation-$AUDIT_SOURCE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: source-inventory-${{ matrix.source }}
          path: services/data-pipeline/data/audits/*.json
          retention-days: 14
